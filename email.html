<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>@yield('title', 'Notificación')</title>
    <style>
        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
                padding: 15px !important;
            }

            .btn {
                display: block !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color: #f0f4f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 30px 0;">
        <tr>
            <td align="center">
                <table class="container" width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.05); overflow: hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #2B6CB0; color: #ffffff; padding: 30px 20px; text-align: center;">
                            <h1 style="margin: 0; font-size: 24px;">@yield('header', 'Título del Correo')</h1>
                        </td>
                    </tr>

                    <!-- Main content -->
                    <tr>
                        <td style="padding: 30px 40px; color: #2D3748; font-size: 16px; line-height: 1.6;">
                            @yield('content')
                        </td>
                    </tr>

                    <!-- CTA -->
                    @hasSection('cta_url')
                    <tr>
                        <td style="padding: 20px 40px; text-align: center;">
                            <a href="@yield('cta_url')" class="btn" style="background-color: #3182CE; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block;">
                                @yield('cta_text', 'Ir al sitio')
                            </a>
                        </td>
                    </tr>
                    @endif

                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #EDF2F7; color: #718096; text-align: center; padding: 20px; font-size: 13px;">
                            @yield('footer', 'Este es un mensaje automático. No respondas a este correo.')
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
